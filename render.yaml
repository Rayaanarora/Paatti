# One-click deploy on Render (Dashboard -> New -> Blueprint -> this repo).
# Free web services sleep when idle: open the URL a minute before you present.
services:
  - type: web
    name: paatti
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: SARVAM_API_KEY
        sync: false
      - key: PAATTI_PUBLIC_URL
        sync: false          # e.g. https://paatti.onrender.com (needed for Twilio + QR)
      - key: PAATTI_CORS_ORIGINS
        value: ""
      - key: PAATTI_OPERATOR_TOKEN
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PAATTI_OUTBOUND_ALLOWLIST
        sync: false
