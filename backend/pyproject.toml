[project]
name = "paatti"
version = "1.0.0"
description = "Scam-baiting honeypot that harvests mule accounts from digital arrest callers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "anthropic>=2.4",
  "google-genai>=1.30",
  "httpx>=0.27",
  "reportlab>=4.0",
  "numpy>=1.26",          # pitch-preserving time-stretch of Paatti's voice
  "python-dotenv>=1.0",   # .env loading used by the launchers (was only implied by uvicorn[standard])
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pytest-timeout>=2"]

[tool.setuptools]
packages = ["paatti"]

[tool.setuptools.package-data]
paatti = ["data/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["paatti"]
