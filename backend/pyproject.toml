[project]
name = "paatti"
version = "1.0.0"
description = "Scam-baiting honeypot that harvests mule accounts from digital arrest callers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "anthropic>=2.4",
  "httpx>=0.27",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["paatti"]
